<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://cdn.modrinth.com https://textures.minecraft.net data: blob:; style-src 'self'">
<title>Catium</title><link rel="stylesheet" href="style.css"></head><body>
<aside>
  <div class="brand"><img src="cat.svg" width="36" height="36" alt=""><b>Catium</b></div>
  <nav>
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span data-i18n="nav_home"></span></button>
    <button data-tab="mods"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span data-i18n="nav_mods"></span></button>
    <button data-tab="opt"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span data-i18n="nav_opt"></span></button>
    <button data-tab="cos"><svg viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg><span data-i18n="nav_cos"></span></button>
    <button data-tab="skins"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span data-i18n="nav_skins"></span></button>
    <button data-tab="console"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 10l3 2-3 2M13 15h3"/></svg><span data-i18n="nav_console"></span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span data-i18n="nav_settings"></span></button>
  </nav>
  <div id="upd" class="upd" hidden><span id="updt"></span><button id="updb" hidden></button></div>
  <button id="login" class="account"></button><button id="offline" class="account sub"></button>
</aside>
<main>
  <section id="home" class="tab on"><div class="home"><div class="col">
    <h1 data-i18n="h_ready"></h1>
    <span class="cap" data-i18n="insts"></span><div id="insts" class="insts"></div>
    <label class="ram"><span><span data-i18n="ram"></span>: <b id="ramv">4 GB</b></span><input type="range" id="ram" min="1" max="16" step="1" value="4"></label>
    <button id="play" class="play"></button>
    <div class="bar"><i id="barfill"></i></div><p id="status" class="status"></p>
  </div><div class="mascot"><img src="cat.svg" alt=""></div></div></section>
  <section id="mods" class="tab"><h1 data-i18n="mods_title"></h1>
    <div id="types" class="chips cats"></div>
    <input class="search" id="q" data-ph="search_ph"><div id="modcats" class="chips cats"></div>
    <details class="card"><summary data-i18n="installedList"></summary><div id="instmods" class="list"></div></details>
    <div id="modlist" class="list"></div></section>
  <section id="opt" class="tab"><h1 data-i18n="opt_title"></h1><p class="lead" data-i18n="opt_lead"></p>
    <p class="hint"><span data-i18n="opt_for"></span>: <b id="optinst"></b></p>
    <div id="presets" class="chips"></div><p id="presetd" class="hint"></p>
    <label class="chk"><input type="checkbox" id="jvm" checked><span data-i18n="jvm"></span></label>
    <div class="chips"><button id="pack" class="play"></button><button id="autoram" class="chip"></button></div><p id="packout" class="status ok"></p></section>
  <section id="cos" class="tab"><h1 data-i18n="cos_title"></h1>
    <details class="card" open><summary data-i18n="cos_installed"></summary><div id="instcos" class="list"></div></details>
    <input class="search" id="qc" data-ph="cos_search"><div id="coslist" class="list"></div></section>
  <section id="skins" class="tab"><h1 data-i18n="skins_title"></h1><div class="skinwrap">
    <div class="skincard"><span class="cap" data-i18n="cur_skin"></span><canvas id="cur" width="16" height="32"></canvas></div>
    <div class="skincard"><span class="cap" data-i18n="new_skin"></span><canvas id="nw" width="16" height="32"></canvas></div>
    <div class="col"><p class="lead" data-i18n="skin_lead"></p><input type="file" id="skinfile" accept="image/png" hidden>
      <div class="chips"><button id="pick" class="chip" data-i18n="pick_skin"></button><button class="chip on" data-v="classic" data-i18n="classic"></button><button class="chip" data-v="slim" data-i18n="slim"></button></div>
      <button id="skinapply" class="play" disabled data-i18n="apply_skin"></button><p id="skinmsg" class="status"></p></div></div>
    <div class="card"><h2 data-i18n="capes"></h2><div id="capes" class="chips"></div><p class="hint" data-i18n="cape_note"></p></div></section>
  <section id="console" class="tab wide"><h1 data-i18n="console_title"></h1>
    <div class="chips"><button id="logclear" class="chip" data-i18n="clear"></button><button id="logcopy" class="chip" data-i18n="copy"></button></div><pre id="log"></pre></section>
  <section id="settings" class="tab"><h1 data-i18n="set_title"></h1>
    <div class="card"><h2 data-i18n="onlaunch"></h2><div id="onlaunch" class="chips"></div><p class="hint" data-i18n="ol_hint"></p></div>
    <div class="card"><h2 data-i18n="discord"></h2><label class="chk"><input type="checkbox" id="dc"><span data-i18n="dc_label"></span></label>
      <input class="search" id="dcid" data-ph="dc_ph"><p class="hint" data-i18n="dc_hint"></p></div>
    <div class="card"><h2 data-i18n="color"></h2><div id="swatches" class="chips"></div><label class="chk"><span data-i18n="custom"></span><input type="color" id="accent" value="#ff8a3d"></label></div>
    <div class="card"><h2 data-i18n="language"></h2><div id="langs" class="chips"></div></div>
    <p class="hint" id="appver"></p></section>
</main>
<dialog id="dlg"><h2 id="dlgt"></h2><div id="dlgb"></div><button id="dlgx" class="chip" data-i18n="close"></button></dialog>
<script src="i18n.js"></script><script src="app.js"></script></body></html>
